name: Build IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: >
          xcodebuild -project GeoStampCam.xcodeproj -scheme GeoStampCam
          -configuration Release -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GeoStampCam.app Payload/
          zip -r GeoStampCam.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GeoStampCam-ipa
          path: GeoStampCam.ipa
